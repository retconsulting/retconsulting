  <style>
  /* RET Learning · onboarding. Page-local layer on top of site.css: every value is a

  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

    padding:var(--space-3) var(--space-6) 0 var(--space-10)}

    var card=document.getElementById('ob-card'),body=document.getElementById('ob-body'),foot=document.getElementById('ob-foot'),
        label=document.getElementById('ob-label'),prog=document.getElementById('ob-prog'),stage=document.getElementById('main');
    var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- recommendation ---------- */
    function realTools(){return st.tools.filter(function(t){return t.length===1;});}
    function startFormat(){
      if(st.goal&&st.goal!=='unsure')return st.goal;
      if(st.level==='3')return 'B';
      if(st.level==='1'||st.level==='2')return 'L';
      return 'S';
    }
    function score(s){
      var tools=realTools(),generic=s[3].length===4,sc=0,why=[];
      if(tools.length){
        var hit=tools.filter(function(t){return s[3].indexOf(t)>-1;});
        if(!hit.length)return null;
        if(generic){sc+=1;}
        else{sc+=3;why.push('Built for '+hit.map(function(t){var o=by(TOOLS,t);return o.short||o.name;}).join(' and '));}
      }else{
        if(!generic)return null;
        if(st.tools.indexOf('unsure')>-1){if(s[0]==='S17')sc+=3;if(s[0]==='B04')sc+=2;}
      }
      if(generic)why.push(st.tools.indexOf('inhouse')>-1&&!tools.length?'Runs on your in-house LLM':'Runs on any tool');
      if(st.level==='mixed'){sc+=[3,3,0,-2][s[4]];}
      else{var d=Math.abs(s[4]-Number(st.level));sc+=[4,1.5,-1,-3][d];}
      var dept=by(DEPTS,st.dept);
      if(dept&&dept.route.indexOf(s[0])>-1){sc+=5;why.unshift(dept.id==='mixed'?'Fits a mixed group':dept.name+' route');}
      return {s:s,score:sc,why:why};
    }
    function route(){
      var out=[];
      ['S','L','B'].forEach(function(f){
        var list=[];
        SESSIONS.forEach(function(s,i){if(s[0].charAt(0)!==f)return;var r=score(s);if(r){r.i=i;list.push(r);}});
        list.sort(function(a,b){return b.score-a.score||a.i-b.i;});
        out.push({f:FORMATS[f],top:list[0]||null,alts:list.slice(1,3)});
      });
      return out;
    }
    function signature(){return [st.tools.join(''),st.level,st.dept,st.goal].join('|');}
    function ensurePicks(){
      var sig=signature();
      if(st.picks&&st.sig===sig)return;
      st.sig=sig;st.custom=false;st.picks=[];
      var sf=startFormat();
      route().forEach(function(c){if(c.f.id===sf&&c.top)st.picks.push(c.top.s[0]);});
    }

        visual+'<span class="ob-opt__text"><span class="ob-opt__name">'+esc(o.name)+'</span>'+(o.desc?'<span class="ob-opt__desc">'+esc(o.desc)+'</span>':'')+(o.extra||'')+'</span>'+key(i)+'</button></li>';

          '<ul class="ob-opts ob-opts--4" role="radiogroup" aria-label="Goal">'+goals.map(function(g,i){
            return opt(g,i,st.goal===g.id,false,g.cover,'ob-opt--stack');}).join('')+'</ul>';
      },
      route:function(){
        ensurePicks();
        var cols=route(),sf=startFormat(),F=FORMATS[sf],n=0;
        var tools=st.tools.map(function(t){var o=by(TOOLS,t);return o.short||o.name;}).join(', ');
        var lv=by(LEVELS,st.level),dp=by(DEPTS,st.dept);
        var answers=[['tools','Tools',tools],['level','Level',lv.name],['dept','Team',dp.short||dp.name],['goal','Goal',st.goal==='unsure'?'Advise me':FORMATS[st.goal].kicker]];
        var h='<div class="ob-head"><span class="ob-eyebrow ob-a" style="--i:0">Your route</span>'+
          '<h1 class="ob-h ob-a" style="--i:1" tabindex="-1">Start with a '+F.name+'. Then build on it.</h1>'+
          '<p class="ob-lead ob-a" style="--i:2">These sessions fit your answers best. Select the ones that interest you, then send me your request.</p>'+
          '<div class="ob-answers ob-a" style="--i:3" aria-label="Your answers">'+answers.map(function(a){
            return '<button type="button" class="ob-answer" data-edit="'+a[0]+'" aria-label="Change '+a[1].toLowerCase()+': '+esc(a[2])+'"><small>'+a[1]+'</small>'+esc(a[2])+I.edit+'</button>';}).join('')+'</div></div>';
        h+='<ol class="ob-route">'+cols.map(function(c,i){
          var isStart=c.f.id===sf;
          var col='<li class="ob-col ob-a'+(isStart?' is-start':'')+'" style="--i:'+(4+i*2)+'">'+
            '<div class="ob-band ob-silk" style="--bx:'+c.f.bloom[0]+';--by:'+c.f.bloom[1]+'">'+
              '<div class="ob-band__row"><span class="ob-band__ord">0'+(i+1)+' / '+c.f.kicker.toUpperCase()+'</span>'+(isStart?'<span class="ob-flag">Start here</span>':'')+'</div>'+
              '<div><div class="ob-band__name">'+c.f.name+'</div><div class="ob-facts">'+c.f.facts.map(function(x){return '<span class="au-chip">'+x+'</span>';}).join('')+'</div></div>'+
            '</div>';
          if(c.top)col+=pick(c.top,false);
          if(c.alts.length){col+='<p class="ob-alt-label">Also fits</p>'+c.alts.map(function(a){return pick(a,true);}).join('');}
          return col+'</li>';}).join('')+'</ol>';
        h+='<div class="ob-custom ob-a'+(st.custom?' is-on':'')+'" style="--i:11" data-custom>'+
          '<div><span class="ob-custom__eyebrow">Tailor-made</span>'+
          '<h2 class="ob-custom__title">Something else in mind? I build it with your team.</h2>'+
          '<p class="ob-custom__body">Every format also runs as a co-created session, shaped around your process, your documents and your roles. We scope it together on a free 30-minute call.</p></div>'+
          addBtn(st.custom,'Add a tailor-made session','Tailor-made added')+'</div>';
        return h;
      },
      request:function(){
        var f=st.form,items=st.picks.map(function(r){var s=session(r),F=FORMATS[r.charAt(0)];
          return '<li class="ob-recap__item"><span class="ob-pick__ref">'+r+'</span><span><span class="ob-recap__name">'+esc(s[1])+'</span><span class="ob-recap__meta">'+F.name+' · '+F.facts.join(' · ')+'</span></span></li>';});
        if(st.custom)items.push('<li class="ob-recap__item"><span class="ob-pick__ref">CO</span><span><span class="ob-recap__name">Tailor-made session</span><span class="ob-recap__meta">Scoped on a free 30-minute call</span></span></li>');
        var lv=by(LEVELS,st.level),dp=by(DEPTS,st.dept);
        var seg=function(name,legend,vals){return '<fieldset class="ob-fieldset"><legend>'+legend+'</legend><div class="ob-seg" role="radiogroup" aria-label="'+legend+'">'+vals.map(function(v){
          return '<button type="button" class="ob-seg__btn" role="radio" aria-checked="'+(f[name]===v?'true':'false')+'" data-seg="'+name+'" data-val="'+v+'">'+v+'</button>';}).join('')+'</div></fieldset>';};
        return '<div class="ob-head"><span class="ob-eyebrow ob-a" style="--i:0">Your request</span>'+
          '<h1 class="ob-h ob-a" style="--i:1" tabindex="-1">Send me your request.</h1>'+

          '<div class="ob-req"><aside class="ob-recap ob-a" style="--i:3" aria-label="Summary">'+

            '<h2 class="ob-recap__title">Your answers</h2><dl>'+
              '<dt>Tools</dt><dd>'+esc(st.tools.map(function(t){var o=by(TOOLS,t);return o.short||o.name;}).join(', '))+'</dd>'+
              '<dt>Level</dt><dd>'+lv.name+'</dd><dt>Team</dt><dd>'+esc(dp.name)+'</dd>'+
              '<dt>Goal</dt><dd>'+(st.goal==='unsure'?'Advise me':FORMATS[st.goal].kicker)+'</dd></dl>'+
          '</aside>'+
          '<form class="rc-form ob-a" style="--i:4" id="ob-form" novalidate>'+
            '<div class="rc-form__row">'+
              '<label class="au-field" for="ob-name"><span class="au-field__label">Your name</span><span class="au-field__box" id="ob-name-box"><input id="ob-name" class="au-field__input" name="name" type="text" autocomplete="name" required aria-describedby="ob-name-help" value="'+esc(f.name)+'"></span><span class="au-field__help au-field__help--error" id="ob-name-help" hidden>Enter your name.</span></label>'+
              '<label class="au-field" for="ob-company"><span class="au-field__label">Company</span><span class="au-field__box"><input id="ob-company" class="au-field__input" name="company" type="text" autocomplete="organization" value="'+esc(f.company)+'"></span></label>'+
            '</div>'+
            seg('size','Number of participants',['1 to 5','6 to 10','11 to 20','More than 20'])+
            seg('mode','Delivery',['On site','Remote','No preference'])+
            seg('lang','Language',['English','French'])+
            '<label class="au-field" for="ob-notes"><span class="au-field__label">Anything else I should know? <span style="font-weight:400;color:var(--text-secondary)">Optional</span></span><span class="au-field__box"><textarea id="ob-notes" class="au-field__input" name="notes" rows="3" maxlength="600" placeholder="Timing, context, a task you want to improve">'+esc(f.notes)+'</textarea></span></label>'+
            '<p class="rc-form__hint">The button opens your email app with the request ready. You send it yourself.</p>'+
          '</form></div>';
      },
      sent:function(){
        return '<div class="ob-sent">'+
          '<span class="ob-sent__mark">'+I.check+'</span>'+
          '<h1 class="ob-h ob-a" style="--i:1;margin:0" tabindex="-1">Your request is ready in your email app.</h1>'+
          '<p class="ob-lead ob-a" style="--i:2;margin:0">Press send there. I reply within two business days. No email app opened? Copy the message and send it to <a href="mailto:'+MAIL+'">'+MAIL+'</a>.</p>'+
          '<pre class="rc-fallback__pre ob-a" style="--i:3" tabindex="0" role="region" aria-label="Message to copy">'+esc(lastMessage)+'</pre>'+
          '<div class="ob-sent__acts ob-a" style="--i:4"><button type="button" class="au-btn au-btn--standard au-btn--primary" data-act="copy">Copy the message</button>'+
          '<a class="au-btn au-btn--standard au-btn--secondary" href="/learning/catalogue/">Browse the catalogue</a>'+
          '<a class="au-btn au-btn--standard au-btn--ghost" href="/learning/">Back to RET Learning</a></div></div>';
      }
    };
    function addBtn(on,off,onText){

    }
    function pick(r,alt){
      var s=r.s,on=st.picks.indexOf(s[0])>-1,parts=s[2].split(' Leave with: ');

      return '<article class="ob-pick'+(alt?' ob-pick--alt':'')+(on?' is-on':'')+'" data-pick="'+s[0]+'">'+

        '<div class="ob-pick__why">'+chips+'</div>'+
        '<div class="ob-pick__foot"><a class="ob-pick__link" href="/learning/catalogue/#'+s[0].toLowerCase()+'" target="_blank" rel="noopener">Details<span class="rc-vh"> of '+s[0]+' (opens in a new tab)</span></a>'+

    /* ---------- footer ---------- */
    function ready(){
      if(st.view==='tools')return st.tools.length>0;
      if(st.view==='level')return st.level!==null;
      if(st.view==='dept')return st.dept!==null;
      if(st.view==='goal')return st.goal!==null;
      if(st.view==='route')return st.picks.length>0||st.custom;
      return true;
    }
    function count(){var n=st.picks.length+(st.custom?1:0);return n?n+(n===1?' session selected':' sessions selected'):'Select at least one session';}
    function drawFoot(){
      var v=st.view,h='';
      if(v==='welcome'||v==='sent'){foot.innerHTML='';return;}
      h+='<button type="button" class="au-btn au-btn--standard au-btn--ghost" data-act="back">'+I.back+' Back</button>';
      if(v==='route')h+='<span class="ob-foot__mid" id="ob-count" aria-live="polite">'+count()+'</span>';
      var text=v==='route'?'Continue to request':v==='request'?'Open my email to send':v==='goal'?'See my route':'Continue';
      h+='<button type="button" class="au-btn au-btn--standard au-btn--primary" data-act="'+(v==='request'?'send':'next')+'"'+(ready()?'':' disabled')+'>'+text+' '+I.arrow+'</button>';
      foot.innerHTML=h;
    }
    function refreshFoot(){

      var c=document.getElementById('ob-count');if(c)c.textContent=count();
    }

    /* ---------- draw + navigation ---------- */
    var FIELD={welcome:['0%','0%','0deg'],tools:['-14%','10%','4deg'],level:['-28%','-8%','8deg'],dept:['-40%','12%','12deg'],goal:['-18%','22%','16deg'],route:['8%','-14%','20deg'],request:['-30%','4%','24deg'],sent:['0%','0%','28deg']};
    function draw(dir){
      var v=st.view,idx=VIEWS.indexOf(v);
      card.setAttribute('data-view',v);
      body.setAttribute('data-dir',dir||'fwd');
      body.innerHTML=view[v]();
      drawFoot();
      Array.prototype.forEach.call(prog.children,function(seg,i){
        seg.className='ob-prog__seg'+(idx>i+1?' is-done':idx===i+1?' is-now':'');});
      label.textContent=idx>=1&&idx<=4?'Question '+idx+' of 4':v==='route'?'Your route':v==='request'?'Your request':v==='sent'?'Ready to send':'';
      var f=FIELD[v];stage.style.setProperty('--ob-bx',f[0]);stage.style.setProperty('--ob-by',f[1]);stage.style.setProperty('--ob-rot',f[2]);
      save();
    }
    function go(v,dir){
      if(busy||v===st.view)return;
      clearTimeout(timer);busy=true;
      body.setAttribute('data-dir',dir||'fwd');body.classList.add('is-leaving');
      setTimeout(function(){
        st.view=v;draw(dir);body.classList.remove('is-leaving');busy=false;
        var top=card.getBoundingClientRect().top;
        if(top<0)window.scrollTo({top:window.pageYOffset+top-80,behavior:reduced?'auto':'smooth'});
        var h=body.querySelector('.ob-h');if(h)h.focus({preventScroll:true});
      },reduced?0:180);
    }
    function next(){
      if(!ready())return;
      var v=st.view;
      if(editing&&v!=='route'&&st.goal!==null&&st.dept!==null&&st.level!==null&&st.tools.length){editing=false;go('route');return;}
      go(VIEWS[VIEWS.indexOf(v)+1]);
    }
    function back(){editing=false;go(VIEWS[VIEWS.indexOf(st.view)-1],'back');}

    function choose(btn){
      var v=st.view,id=btn.getAttribute('data-opt');
      if(v==='tools'){
        var i=st.tools.indexOf(id),solo=by(TOOLS,id).solo;
        if(i>-1)st.tools.splice(i,1);
        else if(solo)st.tools=[id];
        else{st.tools=st.tools.filter(function(t){return !by(TOOLS,t).solo;});st.tools.push(id);}
        st.tools.sort(function(a,b){return TOOLS.indexOf(by(TOOLS,a))-TOOLS.indexOf(by(TOOLS,b));});
        Array.prototype.forEach.call(body.querySelectorAll('[data-opt]'),function(b){
          b.setAttribute('aria-checked',st.tools.indexOf(b.getAttribute('data-opt'))>-1?'true':'false');});
        refreshFoot();save();return;
      }
      st[v]=id;
      Array.prototype.forEach.call(body.querySelectorAll('[data-opt]'),function(b){b.setAttribute('aria-checked',b===btn?'true':'false');});
      refreshFoot();save();
      clearTimeout(timer);timer=setTimeout(next,reduced?0:280);
    }
    function togglePick(el){
      var ref=el.getAttribute('data-pick'),i=st.picks.indexOf(ref);
      if(i>-1)st.picks.splice(i,1);else st.picks.push(ref);
      st.picks.sort(function(a,b){return 'SLB'.indexOf(a.charAt(0))-'SLB'.indexOf(b.charAt(0))||(a<b?-1:1);});
      var on=i===-1;el.classList.toggle('is-on',on);el.querySelector('.ob-add').setAttribute('aria-pressed',on?'true':'false');
      refreshFoot();save();
    }

    /* ---------- request ---------- */
    function message(){
      var f=st.form,lv=by(LEVELS,st.level),dp=by(DEPTS,st.dept),L=[];
      L.push('Hello Redha,','','I used the training finder on retconsulting.be. Here is my request.','','SESSIONS');
      st.picks.forEach(function(r){var s=session(r),F=FORMATS[r.charAt(0)];L.push('- '+r+' · '+s[1]+' ('+F.name+', '+F.facts[0]+')');});
      if(st.custom)L.push('- Tailor-made session, to scope on a call');
      L.push('','OUR CONTEXT',
        'Tools: '+st.tools.map(function(t){return by(TOOLS,t).name;}).join(', '),
        'Level: '+lv.name,'Department: '+dp.name,
        'Goal: '+(st.goal==='unsure'?'Not sure yet, please advise':FORMATS[st.goal].kicker+' ('+FORMATS[st.goal].name+')'));
      L.push('','PRACTICAL');
      if(f.size)L.push('Participants: '+f.size);
      if(f.mode)L.push('Delivery: '+f.mode);
      if(f.lang)L.push('Language: '+f.lang);
      if(f.company)L.push('Company: '+f.company);
      if(f.notes)L.push('','NOTES',f.notes);
      L.push('','Thanks,',f.name);
      return L.join('\n');
    }
    function send(){
      var f=st.form,box=document.getElementById('ob-name-box'),help=document.getElementById('ob-name-help'),input=document.getElementById('ob-name');
      if(!f.name.trim()){box.classList.add('au-field__box--error');help.hidden=false;input.setAttribute('aria-invalid','true');input.focus();return;}
      lastMessage=message();
      var subject='[RET Learning] Training request'+(f.company?' · '+f.company:'');
      go('sent');
      setTimeout(function(){window.location.href='mailto:'+MAIL+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(lastMessage);},reduced?50:500);
    }
    function copy(btn){
      var done=function(){btn.textContent='Copied';setTimeout(function(){btn.textContent='Copy the message';},2000);};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lastMessage).then(done,function(){select();});}else select();
      function select(){var pre=body.querySelector('pre'),r=document.createRange();r.selectNodeContents(pre);var s=window.getSelection();s.removeAllRanges();s.addRange(r);
        try{if(document.execCommand('copy'))done();}catch(e){}}
    }

    /* ---------- events ---------- */
    card.addEventListener('click',function(e){
      if(busy)return;
      var t=e.target,el;
      if((el=t.closest('[data-opt]'))){choose(el);return;}
      if((el=t.closest('[data-act]'))){
        var a=el.getAttribute('data-act');
        if(a==='next')next();else if(a==='back')back();else if(a==='send')send();else if(a==='copy')copy(el);
        else if(a==='restart'){st=blank();editing=false;go('welcome','back');}
        return;
      }
      if((el=t.closest('[data-edit]'))){editing=true;go(el.getAttribute('data-edit'),'back');return;}
      if((el=t.closest('[data-seg]'))){
        var n=el.getAttribute('data-seg'),v=el.getAttribute('data-val');
        st.form[n]=st.form[n]===v?'':v;
        Array.prototype.forEach.call(body.querySelectorAll('[data-seg="'+n+'"]'),function(b){b.setAttribute('aria-checked',st.form[n]===b.getAttribute('data-val')?'true':'false');});
        save();return;
      }
      if(t.closest('a'))return;
      if((el=t.closest('[data-pick]'))){togglePick(el);return;}
      if((el=t.closest('[data-custom]'))){
        st.custom=!st.custom;el.classList.toggle('is-on',st.custom);el.querySelector('.ob-add').setAttribute('aria-pressed',st.custom?'true':'false');
        refreshFoot();save();
      }
    });
    card.addEventListener('input',function(e){
      var n=e.target.name;if(!n||!(n in st.form))return;
      st.form[n]=e.target.value;
      if(n==='name'&&e.target.value.trim()){document.getElementById('ob-name-box').classList.remove('au-field__box--error');document.getElementById('ob-name-help').hidden=true;e.target.removeAttribute('aria-invalid');}
      save();
    });
    card.addEventListener('submit',function(e){e.preventDefault();send();});
    document.addEventListener('keydown',function(e){
      if(busy||e.metaKey||e.ctrlKey||e.altKey)return;
      var t=e.target,tag=t.tagName;
      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
      if(e.key==='Enter'){
        if(tag==='BUTTON'||tag==='A')return;
        if(st.view==='request'){e.preventDefault();send();}
        else if(st.view!=='sent'){e.preventDefault();next();}
        return;
      }
      if(e.key.length===1&&VIEWS.indexOf(st.view)>=1&&VIEWS.indexOf(st.view)<=4){
        var i=LETTERS.indexOf(e.key.toUpperCase()),opts=body.querySelectorAll('[data-opt]');
        if(i>-1&&i<opts.length){e.preventDefault();opts[i].focus();choose(opts[i]);}
      }
    });

    /* a restored session may point at a view whose answers are missing */
    if(VIEWS.indexOf(st.view)>=5&&(!st.tools.length||st.level===null||st.dept===null||st.goal===null))st.view='welcome';
    draw();
  })();
  </script>
</body>
</html>
